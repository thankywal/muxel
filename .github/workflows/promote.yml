name: Promote to main

# Advances main to a dev commit whose full pipeline passed, including the real
# deploy in the smoke job. main is what every user gets: the deploy button
# clones it, updaters sync it, the version check reads it. Nothing reaches it
# without having actually deployed somewhere first.
#
# The push authenticates with a deploy key rather than the workflow token,
# because a promotion can carry workflow file changes and GitHub rejects those
# from the built in token outright. SSH deploy keys are not subject to that
# check.
#
# The push is a fast forward with no force flag. If main has moved on its own,
# the push fails loudly, which is the correct answer to a hand edit landing on
# main: reconcile it into dev first.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  # Also by hand, because a CI run that failed for a reason outside the code,
  # an expired token being the one that has happened, is fixed by re-running
  # the job, and a re-run does not fire workflow_run again. Without this main
  # would sit behind a verified dev commit with nothing saying so.
  workflow_dispatch:
    inputs:
      sha:
        description: Commit on dev to promote. Defaults to the tip of dev.
        required: false

permissions:
  contents: read

concurrency:
  group: promote-to-main
  cancel-in-progress: false

jobs:
  promote:
    name: Fast forward main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >
      github.repository == 'thankywal/muxel' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'dev'))

    steps:
      - uses: actions/checkout@v4
        with:
          ref: >-
            ${{ github.event.workflow_run.head_sha || inputs.sha || 'dev' }}
          fetch-depth: 0

      # A hand run must not promote something CI has not seen pass. The commit
      # is checked here rather than trusted, because the whole point of this
      # branch is that nothing reaches main unverified.
      - name: Confirm CI passed for this commit
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          state=$(gh api "repos/${{ github.repository }}/commits/$sha/check-runs" --jq \
            '[.check_runs[] | select(.name != "Fast forward main")]
             | if length == 0 then "none"
               elif all(.conclusion == "success" or .conclusion == "skipped") then "success"
               else "failed" end')
          echo "Checks on ${sha:0:8}: $state"
          if [ "$state" != "success" ]; then
            echo "Refusing to promote a commit whose checks are $state." >&2
            exit 1
          fi

      - name: Push the verified commit to main
        env:
          PROMOTE_KEY: ${{ secrets.PROMOTE_KEY }}
        run: |
          if [ -z "$PROMOTE_KEY" ]; then
            echo "PROMOTE_KEY is not set; main was not advanced."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$PROMOTE_KEY" > ~/.ssh/promote
          chmod 600 ~/.ssh/promote
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/promote -o IdentitiesOnly=yes"
          git push git@github.com:thankywal/muxel.git HEAD:main
          echo "main is now $(git rev-parse --short HEAD)"
