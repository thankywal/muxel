name: Update from upstream

# Keeps a deployed copy of Muxel current.
#
# This file is pasted into the operator's repository by hand, once, because
# the Cloudflare GitHub App cannot create workflow files when it makes the
# copy. It is deliberately a stub: the update logic lives in scripts/update.sh,
# which arrives with every sync, is committed and reviewable in this
# repository's own history, and can be fixed upstream without anyone having to
# paste this file again.
#
# One repository setting is required before this can push:
# Settings -> Actions -> General -> Workflow permissions -> Read and write.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-from-upstream
  cancel-in-progress: false

jobs:
  update:
    name: Pull upstream changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.repository != 'thankywal/muxel'

    steps:
      - uses: actions/checkout@v4

      - name: Apply upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A copy made before the script existed fetches it once to
          # bootstrap; every later run uses the committed one. It runs from
          # /tmp because the sync replaces the tree it was read from.
          if [ ! -f scripts/update.sh ]; then
            mkdir -p scripts
            curl -fsSL --retry 3 \
              https://raw.githubusercontent.com/thankywal/muxel/main/scripts/update.sh \
              -o scripts/update.sh
          fi
          cp scripts/update.sh /tmp/muxel-update.sh
          bash /tmp/muxel-update.sh
